<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LogicLab — Simulateur de circuits logiques · Bac Pro CIEL</title>
<meta name="author" content="Yahn LE PRETTRE - Formaxion Landes">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="top">
  <div class="brand"><span class="logo" aria-hidden="true">&amp;</span> LogicLab <small>Circuits logiques · Bac Pro CIEL</small><span class="credit">Créé par Yahn LE PRETTRE - Formaxion Landes</span></div>
  <div class="grp" role="group" aria-label="Fichier">
    <button id="btn-new" title="Nouveau schéma vide">Nouveau</button>
    <button id="btn-open" title="Ouvrir un fichier .json">Ouvrir</button>
    <button id="btn-save" title="Enregistrer le schéma (.json)">Enregistrer</button>
    <button id="btn-scen" class="accent" title="Charger un TP">TP ▾</button>
  </div>
  <div class="grp sim" role="group" aria-label="Simulation">
    <button id="btn-run" title="Pause / lecture (Espace)">⏸ Pause</button>
    <button id="btn-reset" title="Remet le temps à zéro, les bascules à 0 et efface le chronogramme">↺ Reset</button>
    <label class="spd" title="Vitesse : temps simulé par seconde réelle">Vitesse <input id="speed" type="range" min="0" max="100" value="50" aria-label="Vitesse"><output id="speedv">×1</output></label>
    <span id="simtime" class="mono">t = 0.000 s</span><span id="simwarn" class="warnbadge" style="display:none"></span>
  </div>
  <div class="grp opts" role="group" aria-label="Options">
    <label title="Affiche 0 / 1 / ? à côté de chaque broche"><input type="checkbox" id="opt-levels" checked> Niveaux sur les broches</label>
    <label title="Voir les fonctions cachées, les corrigés"><input type="checkbox" id="opt-teacher"> Mode enseignant</label>
    <button id="btn-lock" title="Verrouiller le mode enseignant par un code PIN à 6 chiffres (journal des tentatives)">🔑</button>
    <button id="btn-fit" title="Recentrer la vue">⌖</button>
    <button id="btn-help" title="Aide, symboles et couverture du programme">? Aide</button>
  </div>
</header>
<div id="main">
  <aside id="left" aria-label="Composants">
    <div id="tools" role="toolbar" aria-label="Outils">
      <button class="tool on" data-tool="select" title="Sélection / déplacement (V)">🖱 Sélection</button>
      <button class="tool" data-tool="wire" title="Câbler (C) — ou tirez depuis une broche">〰 Fil</button>
      <button class="tool" data-tool="delete" title="Supprimer (Suppr)">🗑 Supprimer</button>
      <button id="btn-rot" title="Pivoter le composant sélectionné (R)">⟳ Pivoter</button>
      <button id="btn-undo" title="Annuler (Ctrl+Z)">↶</button>
    </div>
    <div id="palette"></div>
  </aside>
  <section id="center">
    <div id="stage">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg" role="application" aria-label="Schéma logique">
        <defs><pattern id="gridp" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="0" cy="0" r="1" fill="#b9c3d1"/></pattern></defs>
        <g id="world"><rect id="gridrect" x="-4000" y="-4000" width="8000" height="8000" fill="url(#gridp)"/><g id="wires"></g><g id="parts"></g><g id="juncs"></g><g id="rubber"></g></g>
      </svg>
      <div id="toolhint" class="hint"></div>
      <div id="banner" style="display:none"></div>
      <div id="legend"><span><i class="lg lg1"></i>1</span><span><i class="lg lg0"></i>0</span><span><i class="lg lgx"></i>? indéterminé</span></div>
    </div>
    <div id="dock">
      <div id="docktabs" role="tablist">
        <button class="dtab on" data-dock="chrono">Chronogramme</button><button class="dtab" data-dock="table">Table de vérité</button><button class="dtab" data-dock="eq">Équations</button><button class="dtab" data-dock="karnaugh">Karnaugh</button><button class="dtab" data-dock="designer">Concepteur</button><button class="dtab" data-dock="log">Journal</button>
        <button id="dockmin" title="Réduire / afficher">▾</button>
      </div>
      <div id="dockbody">
        <div id="pane-chrono" class="pane"></div><div id="pane-table" class="pane" style="display:none"></div><div id="pane-eq" class="pane" style="display:none"></div>
        <div id="pane-karnaugh" class="pane" style="display:none"></div><div id="pane-designer" class="pane" style="display:none"></div><div id="pane-log" class="pane" style="display:none"></div>
      </div>
    </div>
  </section>
  <aside id="right" aria-label="Propriétés">
    <div id="rtabs" role="tablist"><button class="rtab on" data-r="insp">Propriétés</button><button class="rtab" data-r="tp">Sujet de TP</button></div>
    <div id="inspector" class="rpane"></div>
    <div id="tppane" class="rpane" style="display:none"></div>
  </aside>
</div>
<input type="file" id="filein" accept=".json,application/json" style="display:none">
<script src="js/util.js"></script>
<script src="js/logic.js"></script>
<script src="js/parts.js"></script>
<script src="js/circuit.js"></script>
<script src="js/engine.js"></script>
<script src="js/analysis.js"></script>
<script src="js/synth.js"></script>
<script src="js/editor.js"></script>
<script src="js/chrono.js"></script>
<script src="js/views.js"></script>
<script src="js/karnaugh.js"></script>
<script src="js/designer.js"></script>
<script src="js/teacher.js"></script>
<script src="js/app.js"></script>
<script src="js/scenarios.js"></script>
<script src="js/cours.js"></script>
<script src="js/tp_portes.js"></script>
<script src="js/tp_equations.js"></script>
<script src="js/tp_boole.js"></script>
<script src="js/tp_conception.js"></script>
<script src="js/tp_signaux.js"></script>
<script src="js/td.js"></script>
<script src="js/coverage.js"></script>
<script src="js/main.js"></script>
</body>
</html>
